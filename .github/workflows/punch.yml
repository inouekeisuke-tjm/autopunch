name: Attendance Auto Punch

on:
  # Vercel Cron からの workflow_dispatch 呼び出しで実行
  # schedule:
  #   - cron: '58 21 * * 0-4'
  #   - cron: '45 10 * * 1-5'
  workflow_dispatch:
    inputs:
      type:
        description: 'Punch type (attendance or clock-out)'
        required: true
        default: 'attendance'
        type: choice
        options:
          - attendance
          - clock-out
      skip_holiday_check:
        description: 'Skip holiday check'
        required: false
        default: 'false'
        type: string

jobs:
  punch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Determine Type
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "Workflow dispatch, running immediately."
            echo "PUNCH_TYPE=${{ github.event.inputs.type }}" >> $GITHUB_ENV
          else
            SCHEDULE="${{ github.event.schedule }}"
            echo "Triggered by schedule: $SCHEDULE"
            if [ "$SCHEDULE" == "58 21 * * 0-4" ]; then
              PUNCH_TYPE="attendance"
            elif [ "$SCHEDULE" == "45 10 * * 1-5" ]; then
              PUNCH_TYPE="clock-out"
            else
              echo "Unknown schedule: $SCHEDULE"
              exit 1
            fi
            
            echo "Detected Type: $PUNCH_TYPE"
            echo "PUNCH_TYPE=$PUNCH_TYPE" >> $GITHUB_ENV
          fi

      - name: Perform Punch
        env:
          PUNCH_URL: ${{ secrets.PUNCH_URL }}
          PUNCH_EMP_CODE: ${{ secrets.PUNCH_EMP_CODE }}
          PUNCH_PASSWORD: ${{ secrets.PUNCH_PASSWORD }}
          SKIP_HOLIDAY_CHECK: ${{ github.event.inputs.skip_holiday_check == 'true' }}
        run: |
          echo "Starting $PUNCH_TYPE punch..."
          npx tsx scripts/punch.mts "$PUNCH_TYPE"

      - name: Send Email on Failure
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.MAIL_SERVER }}
          server_port: ${{ secrets.MAIL_PORT || 465 }}
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "【警告】勤怠自動打刻失敗アラート"
          to: inouek2@tjmdesign.com
          from: AutoPunch Agent <${{ secrets.MAIL_USERNAME }}>
          body: |
            勤怠自動打刻（${{ env.PUNCH_TYPE }}）に失敗しました。
            
            実行ログおよびステータスは以下のURLから確認できます。
            URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            
            お手数ですが、勤怠システムへログインし手動での打刻・修正を行ってください。
